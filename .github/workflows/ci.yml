name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Repository hygiene
        run: pnpm check:hygiene

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

      - name: Coverage
        run: pnpm vitest run --config vitest.config.ts --coverage

      - name: Security audit
        run: pnpm audit

      - name: Build
        run: pnpm -r build

      - name: Packed CLI smoke test
        run: pnpm test:package
